<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV98 - Hacked by Kat</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --accent-color: #00d2ff;
        }
        body {
            margin: 0;
            padding: 50px;
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }
        h1 {
            font-size: 32px;
            margin: 0;
            color: var(--accent-color);
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
            letter-spacing: 1px;
        }
        .subtitle {
            margin: 5px 0 0 0;
            color: #8b949e;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .clock {
            font-size: 28px;
            font-weight: 300;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .grid {
            display: flex;
            gap: 24px;
            margin-top: 30px;
        }
        .card {
            width: 200px;
            height: 120px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, background 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .card:focus, .card:hover {
            transform: scale(1.12);
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.18);
        }
        .card span {
            margin-top: 12px;
            font-size: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Hacked by Kat</h1>
            <p class="subtitle">Custom Modern Launcher</p>
        </div>
        <div class="clock" id="clock">--:--</div>
    </header>

    <div class="grid">
        <div class="card" tabindex="0" onmouseover="changeBg('#e50914')">
            <span style="font-size: 34px;">🎬</span>
            <span>Netflix</span>
        </div>
        <div class="card" tabindex="0" onmouseover="changeBg('#0078d7')">
            <span style="font-size: 34px;">✨</span>
            <span>Disney+</span>
        </div>
        <div class="card" tabindex="0" onmouseover="changeBg('#ff9900')">
            <span style="font-size: 34px;">📦</span>
            <span>Prime Video</span>
        </div>
        <div class="card" tabindex="0" onmouseover="changeBg('#4285f4')">
            <span style="font-size: 34px;">🛒</span>
            <span>Play Store</span>
        </div>
    </div>

    <script>
        // Actualizare ceas în timp real
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        // Schimbare dinamică a fundalului la trecerea pe dale
        function changeBg(color) {
            document.documentElement.style.setProperty('--bg-color', color);
        }
    </script>
</body>
</html>
